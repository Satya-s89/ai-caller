<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Caller — Telugu Voice Assistant Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: rgba(22, 31, 49, 0.7);
            --bg-card-hover: rgba(30, 42, 66, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --glow: 0 0 25px rgba(139, 92, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
            box-shadow: var(--glow);
        }

        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Main Section & Table */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-weight: 500;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tbody tr {
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background-color: var(--bg-card-hover);
        }

        .badge-status {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-completed {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .badge-active {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
        }

        .btn-view {
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-view:hover {
            background: var(--accent-purple);
            color: #fff;
            box-shadow: var(--glow);
        }

        /* Modal for Transcript */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 90%;
            max-width: 650px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .chat-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .chat-assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .role-label {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-bottom: 0.2rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="logo-icon">AI</div>
                <div class="title-group">
                    <h1>Telugu Voice Agent Dashboard</h1>
                    <p>Live Monitoring & Call Transcripts</p>
                </div>
            </div>
            <div class="live-badge">
                <div class="dot"></div>
                System Active
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Calls Handled</div>
                <div class="stat-value" id="stat-total-calls">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Audio Duration</div>
                <div class="stat-value" id="stat-total-duration">0s</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Primary STT / Voice</div>
                <div class="stat-value" style="font-size: 1.2rem; margin-top: 0.4rem; color: var(--accent-cyan);">Sarvam AI (Telugu)</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Call History</h2>
                <span id="last-updated" style="font-size: 0.8rem; color: var(--text-secondary);">Updating...</span>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Call ID</th>
                            <th>Caller Number</th>
                            <th>Start Time</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Transcript</th>
                        </tr>
                    </thead>
                    <tbody id="calls-tbody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-secondary);">Loading call records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Transcript -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Call Transcript</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Chat bubbles rendered dynamically -->
            </div>
        </div>
    </div>

    <script>
        async function fetchCalls() {
            try {
                const res = await fetch('/api/calls');
                const data = await res.json();
                if (data.status === 'success') {
                    renderDashboard(data.calls);
                }
            } catch (err) {
                console.error('Failed to fetch calls:', err);
            }
        }

        function renderDashboard(calls) {
            const tbody = document.getElementById('calls-tbody');
            document.getElementById('stat-total-calls').textContent = calls.length;

            let totalSecs = 0;
            calls.forEach(c => totalSecs += (c.duration_seconds || 0));
            document.getElementById('stat-total-duration').textContent = formatDuration(totalSecs);

            document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();

            if (calls.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">No call records found yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = calls.map(c => {
                const isCompleted = c.end_time != null;
                const statusBadge = isCompleted 
                    ? `<span class="badge-status badge-completed">Completed</span>`
                    : `<span class="badge-status badge-active">In Progress</span>`;
                
                const formattedTime = c.start_time ? new Date(c.start_time).toLocaleString() : 'N/A';
                const durationStr = formatDuration(c.duration_seconds || 0);

                return `
                    <tr>
                        <td style="font-family: monospace; font-size: 0.85rem;">${escapeHtml(c.call_id)}</td>
                        <td>${escapeHtml(c.caller_phone || 'Unknown')}</td>
                        <td>${formattedTime}</td>
                        <td>${durationStr}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn-view" onclick="showTranscript('${escapeHtml(c.call_id)}')">View Transcript</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function showTranscript(callId) {
            try {
                const res = await fetch(`/api/calls/${callId}`);
                const data = await res.json();
                if (data.status === 'success' && data.call) {
                    const call = data.call;
                    document.getElementById('modal-title').textContent = `Transcript: ${call.caller_phone || call.call_id}`;
                    const body = document.getElementById('modal-body');
                    
                    if (!call.transcript || call.transcript.length === 0) {
                        body.innerHTML = `<p style="color: var(--text-secondary); text-align: center;">No transcript entries recorded for this call.</p>`;
                    } else {
                        body.innerHTML = call.transcript.map(item => {
                            const isUser = item.role === 'user';
                            const bubbleClass = isUser ? 'chat-user' : 'chat-assistant';
                            const roleName = isUser ? 'Caller' : 'Telugu AI Agent';
                            return `
                                <div class="chat-bubble ${bubbleClass}">
                                    <div class="role-label">${roleName}</div>
                                    <div>${escapeHtml(item.text || item.content || '')}</div>
                                </div>
                            `;
                        }).join('');
                    }
                    
                    document.getElementById('modal-overlay').classList.add('active');
                }
            } catch (err) {
                console.error('Failed to load transcript:', err);
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function formatDuration(seconds) {
            if (!seconds) return '0s';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            if (m === 0) return `${s}s`;
            return `${m}m ${s}s`;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Close modal on escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Fetch on load & poll every 3s
        fetchCalls();
        setInterval(fetchCalls, 3000);
    </script>
</body>
</html>
